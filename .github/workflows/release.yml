name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to release
                required: true
                type: string

permissions:
    contents: write
    attestations: write
    id-token: write
    artifact-metadata: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Resolve release target
              id: release-target
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                    tag="$INPUT_TAG"
                    ref="refs/tags/${tag}"
                  else
                    tag="${GITHUB_REF#refs/tags/}"
                    ref="${GITHUB_REF}"
                  fi

                  if [[ ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "Release tag must use x.y.z, without a v prefix or extra components." >&2
                    exit 1
                  fi

                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "ref=${ref}" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.release-target.outputs.ref }}

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: npm

            - name: Validate and build plugin
              env:
                  RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
              run: |
                  npm ci
                  npm run validate:official
                  npm test

            - name: Attest release assets
              uses: actions/attest@v4
              with:
                  subject-path: |
                      manifest.json
                      temp/vault/.obsidian/plugins/mandala-grid-dev/main.js
                      temp/vault/.obsidian/plugins/mandala-grid-dev/styles.css

            - name: Create or update release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
              run: |
                  set -euo pipefail
                  tag="$RELEASE_TAG"
                  assets=(
                    manifest.json
                    temp/vault/.obsidian/plugins/mandala-grid-dev/main.js
                    temp/vault/.obsidian/plugins/mandala-grid-dev/styles.css
                  )

                  for asset in "${assets[@]}"; do
                    test -f "$asset"
                  done

                  if gh release view "$tag" >/dev/null 2>&1; then
                    if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
                      echo "Refusing to overwrite assets of a published release." >&2
                      exit 1
                    fi
                    gh release upload "$tag" "${assets[@]}" --clobber
                  else
                    gh release create "$tag" \
                      --title="$tag" \
                      --verify-tag \
                      --notes-file="docs/releases/${tag}.md" \
                      --draft \
                      "${assets[@]}"
                  fi
